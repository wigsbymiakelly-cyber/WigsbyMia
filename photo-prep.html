<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Prepare Product Photos | Wigs by Mia Kelly</title>
    <script type="module" src="/app/photo-prep.ts"></script>
  </head>
  <body>
    <main class="tool-shell">
      <a class="back-link" href="/admin/">← Back to inventory tools</a>
      <section class="tool-card">
        <p class="eyebrow">Wigs by Mia Kelly</p>
        <h1>Prepare Product Photos</h1>
        <p class="intro">Choose your original photos. This tool makes upload-ready copies without sending your photos anywhere.</p>
        <label class="drop-zone" for="photo-input">
          <span class="drop-icon">＋</span><strong>Choose photos</strong>
          <span>JPEG, PNG, or WebP · select several at once</span>
          <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple />
        </label>
        <div id="status" class="status" aria-live="polite"></div>
        <div id="results" class="results"></div>
      </section>
      <p class="privacy-note">Photos are resized on this device. Originals are never changed.</p>
    </main>
  </body>
</html>
